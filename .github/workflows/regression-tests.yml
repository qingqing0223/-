name: monitoring-regression-tests

on:
  push:
    branches: [main]
    paths-ignore:
      - 'results/**'
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install integration package
        run: python -m pip install -r requirements.txt

      - name: Compile critical Python modules
        run: |
          python -m py_compile monitor/*.py pipeline/*.py dashboard_adapter/*.py scripts/*.py

      - name: Smoke-test public-region patch against pinned MediaCrawler
        run: |
          git clone --quiet https://github.com/NanmiCoder/MediaCrawler.git /tmp/MediaCrawler
          git -C /tmp/MediaCrawler checkout --quiet 60e66f2a925816960bbd44af5d6c9b8385d79335
          python scripts/patch_mediacrawler_public_regions.py --root /tmp/MediaCrawler
          python scripts/verify_mediacrawler_public_regions.py --root /tmp/MediaCrawler
          python scripts/patch_douyin_startup_resilience.py --root /tmp/MediaCrawler
          python scripts/patch_douyin_startup_resilience.py --root /tmp/MediaCrawler --check
          python scripts/patch_douyin_comment_request_profile.py --root /tmp/MediaCrawler
          python scripts/patch_douyin_comment_request_profile.py --root /tmp/MediaCrawler --check
          python scripts/patch_xhs_realtime_resilience.py --root /tmp/MediaCrawler
          python scripts/patch_xhs_realtime_resilience.py --root /tmp/MediaCrawler --check
          python scripts/patch_xhs_comment_hierarchy.py --root /tmp/MediaCrawler
          python scripts/patch_xhs_comment_hierarchy.py --root /tmp/MediaCrawler --check
          python scripts/patch_xhs_public_regions.py --root /tmp/MediaCrawler
          python scripts/patch_xhs_public_regions.py --root /tmp/MediaCrawler --check
          python -m py_compile scripts/toutiao_crawler.py
          python scripts/patch_kuaishou_comment_regions.py --root /tmp/MediaCrawler
          python scripts/patch_kuaishou_comment_regions.py --root /tmp/MediaCrawler --check
          set +e
          python scripts/patch_weibo_realtime_resilience.py --root /tmp/MediaCrawler 2>&1 | tee /tmp/weibo_patch.log
          rc=${PIPESTATUS[0]}
          if [ "$rc" -eq 0 ]; then python scripts/patch_weibo_realtime_resilience.py --root /tmp/MediaCrawler --check 2>&1 | tee -a /tmp/weibo_patch.log; rc=${PIPESTATUS[0]}; fi
          if [ "$rc" -eq 0 ]; then python scripts/patch_weibo_comment_hierarchy.py --root /tmp/MediaCrawler 2>&1 | tee -a /tmp/weibo_patch.log; rc=${PIPESTATUS[0]}; fi
          if [ "$rc" -eq 0 ]; then python scripts/patch_weibo_comment_hierarchy.py --root /tmp/MediaCrawler --check 2>&1 | tee -a /tmp/weibo_patch.log; rc=${PIPESTATUS[0]}; fi
          if [ "$rc" -eq 0 ]; then python scripts/patch_weibo_public_regions.py --root /tmp/MediaCrawler 2>&1 | tee -a /tmp/weibo_patch.log; rc=${PIPESTATUS[0]}; fi
          if [ "$rc" -eq 0 ]; then python scripts/patch_weibo_public_regions.py --root /tmp/MediaCrawler --check 2>&1 | tee -a /tmp/weibo_patch.log; rc=${PIPESTATUS[0]}; fi
          # Weibo patches must also be safe to re-apply on long-running student nodes.
          if [ "$rc" -eq 0 ]; then python scripts/patch_weibo_realtime_resilience.py --root /tmp/MediaCrawler 2>&1 | tee -a /tmp/weibo_patch.log; rc=${PIPESTATUS[0]}; fi
          if [ "$rc" -eq 0 ]; then python scripts/patch_weibo_comment_hierarchy.py --root /tmp/MediaCrawler 2>&1 | tee -a /tmp/weibo_patch.log; rc=${PIPESTATUS[0]}; fi
          if [ "$rc" -eq 0 ]; then python scripts/patch_weibo_public_regions.py --root /tmp/MediaCrawler 2>&1 | tee -a /tmp/weibo_patch.log; rc=${PIPESTATUS[0]}; fi
          if [ "$rc" -eq 0 ]; then python scripts/patch_weibo_realtime_resilience.py --root /tmp/MediaCrawler --check 2>&1 | tee -a /tmp/weibo_patch.log; rc=${PIPESTATUS[0]}; fi
          if [ "$rc" -eq 0 ]; then python scripts/patch_weibo_comment_hierarchy.py --root /tmp/MediaCrawler --check 2>&1 | tee -a /tmp/weibo_patch.log; rc=${PIPESTATUS[0]}; fi
          if [ "$rc" -eq 0 ]; then python scripts/patch_weibo_public_regions.py --root /tmp/MediaCrawler --check 2>&1 | tee -a /tmp/weibo_patch.log; rc=${PIPESTATUS[0]}; fi
          if [ "$rc" -ne 0 ]; then
            {
              echo "## Weibo patch smoke failure"
              echo '~~~text'
              cat /tmp/weibo_patch.log
              echo '~~~'
            } >> "$GITHUB_STEP_SUMMARY"
            exit "$rc"
          fi
          set -e

      - name: Validate Windows PowerShell acceptance scripts
        shell: pwsh
        run: |
          $paths = @(
            'scripts/test_kuaishou_realtime_5min_windows.ps1',
            'scripts/test_douyin_realtime_5min_windows.ps1',
            'scripts/test_remaining_platform_realtime_5min_windows.ps1',
            'scripts/check_public_region_acceptance_windows.ps1'
          )
          foreach ($path in $paths) {
            $bytes = [System.IO.File]::ReadAllBytes($path)
            if ($bytes | Where-Object { $_ -gt 127 }) {
              throw "$path must remain ASCII-only for Windows PowerShell 5.1 compatibility"
            }
            $tokens = $null
            $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile($path, [ref]$tokens, [ref]$errors) | Out-Null
            if ($errors.Count -gt 0) {
              $errors | ForEach-Object { Write-Error $_.Message }
              throw "$path contains PowerShell parse errors"
            }
          }

      - name: Run regression tests
        run: python -m unittest discover -s tests -v
