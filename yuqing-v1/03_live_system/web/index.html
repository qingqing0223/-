<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>民族团结进步宣传周舆情态势感知系统</title>
  <link rel="icon" href="data:,">
  <style>
    :root{
      --bg:#071624;--panel:rgba(12,32,49,.8);--line:rgba(119,190,226,.24);
      --text:#eef8ff;--muted:#9cc9df;--hot:#eecb72;--red:#d96f6a;--cyan:#38bde8;
      font-family:"Microsoft YaHei UI","PingFang SC",Arial,sans-serif;color:var(--text);background:var(--bg);
    }
    *{box-sizing:border-box} html,body{width:100%;height:100%;margin:0;overflow:hidden;background:
      radial-gradient(circle at 22% 16%,rgba(56,145,196,.18),transparent 26%),
      radial-gradient(circle at 82% 20%,rgba(91,166,204,.1),transparent 20%),
      linear-gradient(180deg,#06121f,#0a1d2d 52%,#071624)}
    body{color:var(--text)}
    .screen{width:100vw;height:100vh;max-width:1920px;margin:0 auto;padding:5px 7px;display:grid;
      grid-template-rows:34px 36px minmax(0,1fr) 202px;gap:5px;overflow:hidden}
    .topbar{position:relative;display:grid;grid-template-columns:1fr auto 1fr;align-items:center;min-width:0}
    .topbar::before{content:"";position:absolute;left:22%;right:22%;bottom:0;height:1px;background:linear-gradient(90deg,transparent,rgba(56,189,232,.78),rgba(120,205,218,.48),transparent)}
    .title{text-align:center;grid-column:2;position:relative;padding:0 30px}.title::before,.title::after{content:"";position:absolute;top:50%;width:58px;height:1px;background:linear-gradient(90deg,transparent,rgba(56,189,232,.7))}.title::before{right:100%;transform:translateY(-50%)}.title::after{left:100%;transform:translateY(-50%) rotate(180deg)}
    .title h1{margin:0;font-size:23px;line-height:1.05;letter-spacing:1px;color:#f5fbff;text-shadow:0 0 14px rgba(56,189,232,.45)}
    .top-actions{grid-column:3;display:flex;align-items:center;justify-content:flex-end;gap:10px;min-width:0}
    .live-status{display:flex;align-items:center;justify-content:flex-end;gap:6px;font-size:11px;color:var(--muted);white-space:nowrap;min-width:0;overflow:hidden}
    .live-status .dot{width:8px;height:8px;border-radius:50%;background:#9cc9df;box-shadow:0 0 8px rgba(156,201,223,.7);flex:0 0 auto}
    .live-status.on .dot{background:#3fe08a;box-shadow:0 0 10px rgba(63,224,138,.95)}
    .live-status.off .dot{background:#d96f6a;box-shadow:none}
    .live-status.pending .dot{background:#eecb72;box-shadow:0 0 8px rgba(238,203,114,.8)}
    .report-open{border:1px solid rgba(56,189,232,.55);background:linear-gradient(180deg,rgba(25,84,117,.92),rgba(13,52,77,.92));color:#e9f8ff;border-radius:6px;padding:5px 10px;font:inherit;font-size:11px;line-height:1;white-space:nowrap;cursor:pointer;box-shadow:inset 0 1px 0 rgba(255,255,255,.08),0 0 12px rgba(56,189,232,.12)}
    .report-open:hover{border-color:rgba(238,203,114,.8);color:#fff4c5;background:linear-gradient(180deg,rgba(38,98,127,.96),rgba(17,61,88,.96))}
    .report-modal-mask{position:fixed;inset:0;z-index:1000;display:none;align-items:center;justify-content:center;padding:20px;background:rgba(1,10,18,.74);backdrop-filter:blur(4px)}
    .report-modal-mask.open{display:flex}
    .report-modal{width:min(460px,calc(100vw - 32px));border:1px solid rgba(97,196,235,.5);border-radius:12px;background:linear-gradient(180deg,#102b40,#091c2c);box-shadow:0 24px 70px rgba(0,0,0,.5),inset 0 1px 0 rgba(255,255,255,.06);overflow:hidden}
    .report-modal-head{display:flex;align-items:center;justify-content:space-between;padding:14px 16px;border-bottom:1px solid rgba(119,190,226,.2)}
    .report-modal-head h2{margin:0;font-size:16px}.report-close{border:0;background:transparent;color:#9cc9df;font-size:22px;line-height:1;cursor:pointer;padding:0 2px}.report-close:hover{color:#fff}
    .report-modal-body{display:grid;gap:13px;padding:16px}.report-field{display:grid;grid-template-columns:92px minmax(0,1fr);gap:10px;align-items:center}.report-field label{font-size:12px;color:var(--muted)}
    .report-select{width:100%;border:1px solid rgba(119,190,226,.3);border-radius:6px;background:#0b2133;color:#eff9ff;padding:8px 10px;font:inherit;font-size:12px;outline:none}.report-select:focus{border-color:var(--cyan)}
    .report-status{min-height:58px;border:1px solid rgba(119,190,226,.16);border-radius:7px;background:rgba(5,19,31,.54);padding:10px 12px;font-size:12px;line-height:1.6;color:#c9e6f4}.report-status strong{color:#fff}.report-status.warn{border-color:rgba(238,203,114,.38);color:#f4dfa4}.report-status.error{border-color:rgba(217,111,106,.5);color:#ffc0bc}
    .report-storage{font-size:10px;color:#7faabf;overflow-wrap:anywhere}.report-modal-actions{display:flex;justify-content:flex-end;gap:8px;padding:0 16px 16px}.report-action,.report-cancel{border-radius:6px;padding:8px 15px;font:inherit;font-size:12px;cursor:pointer}.report-cancel{border:1px solid rgba(119,190,226,.26);background:rgba(12,37,55,.8);color:#badbec}.report-action{border:1px solid rgba(56,189,232,.62);background:#17658b;color:#fff;font-weight:700}.report-action:disabled{cursor:not-allowed;opacity:.46}
    .kpis{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:6px}
    .kpi,.panel,.map-panel{border:1px solid var(--line);background:var(--panel);border-radius:8px;
      box-shadow:inset 0 1px 0 rgba(255,255,255,.05),0 12px 28px rgba(0,0,0,.18);min-width:0;min-height:0}
    .kpi{display:flex;align-items:center;justify-content:center;gap:7px;padding:4px 8px;overflow:hidden}
    .kpi span{font-size:12px;color:var(--muted);white-space:nowrap}.kpi b{font-size:15px;color:#fff;white-space:nowrap}
    .main{position:relative;min-height:0;overflow:hidden;border:1px solid rgba(127,197,236,.14);border-radius:8px;background:rgba(4,15,29,.28)}
    .rail{position:absolute;top:5px;bottom:5px;z-index:5;display:grid;grid-template-rows:minmax(0,1fr) 110px;gap:5px;min-height:0}
    .rail-left{left:5px;width:286px;grid-template-rows:minmax(0,1fr) 230px}.rail-right{right:5px;width:318px;grid-template-rows:minmax(0,1.15fr) minmax(0,.85fr)}
    .bottom{display:grid;grid-template-columns:1.08fr .92fr 1fr 1fr 1.08fr;gap:6px;min-height:0}
    .panel{display:flex;flex-direction:column;overflow:hidden;background:rgba(12,32,49,.72)}
    .panel-title{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:7px 9px 0;min-width:0}
    .timeline-title{display:grid;grid-template-columns:minmax(0,1fr) auto;grid-template-rows:auto auto;align-items:center;gap:3px 6px}
    .timeline-title h2{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
    .timeline-title #timelineTag{grid-column:1/-1;text-align:left;min-width:0;overflow:hidden;text-overflow:ellipsis}
    .panel-title h2{font-size:13px;line-height:1.1;margin:0;white-space:nowrap}
    .panel-title h2 a{color:inherit;text-decoration:none;cursor:pointer}
    .panel-title h2 a:hover{color:var(--hot)}
    .panel-title span{font-size:10px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
    .timeline-controls{display:flex;align-items:center;gap:2px;flex:0 0 auto}
    .timeline-switch{border:1px solid rgba(127,197,236,.34);background:rgba(24,68,100,.52);color:#b9dff2;padding:3px 7px;font:inherit;font-size:10px;line-height:1.1;cursor:pointer}
    .timeline-switch:first-child{border-radius:5px 0 0 5px}.timeline-switch:last-child{border-radius:0 5px 5px 0}
    .timeline-switch.active{background:rgba(56,189,232,.24);border-color:rgba(56,189,232,.78);color:#fff}
    .chart{flex:1;min-height:0;width:100%}.split{display:grid;grid-template-rows:minmax(0,1fr) 0;gap:4px;flex:1;min-height:0;padding:4px 5px 5px}
    .platform-tip{position:absolute;z-index:20;display:none;width:198px;padding:8px;border-radius:6px;background:#f8fbff;color:#64717a;box-shadow:0 10px 24px rgba(0,0,0,.24);pointer-events:none}
    .platform-tip .tip-name{font-size:14px;font-weight:700;margin-bottom:6px;color:#5f6b73;white-space:normal;line-height:1.2}
    .platform-tip .tip-total{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:8px}.platform-tip b{font-size:20px;color:#5f6b73}
    .tip-bar{height:10px;border-radius:999px;overflow:hidden;background:#e7eef4;display:flex}.tip-bar span{height:100%}.tip-foot{display:flex;justify-content:space-between;margin-top:6px;font-size:10px;color:#74808a;gap:6px}.tip-foot span{white-space:nowrap}
    .split>div{min-height:0;display:flex;flex-direction:column}.split>div:first-child .chart{min-height:150px}
    .split>.mini-meta{display:none!important}
    /* 注意：必须比 .split>div 的 display:flex 权重更高，否则标签会竖排并被裁掉 */
    .split>.mini-meta{display:grid;flex-direction:row;grid-auto-flow:column;grid-template-columns:repeat(3,minmax(0,1fr));gap:4px;padding:0 4px 2px}
    .split>.mini-meta.cols2{grid-template-columns:repeat(2,minmax(0,1fr))}
    .mini-meta div{display:flex;align-items:center;justify-content:space-between;gap:5px;border:1px solid rgba(127,197,236,.15);background:rgba(10,28,47,.55);border-radius:6px;padding:3px 5px;min-width:0;min-height:26px}
    .mini-meta span{min-width:0;color:var(--muted);font-size:9px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.mini-meta b{min-width:0;display:block;font-size:12px;line-height:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;text-align:right}
    .feed{display:flex;flex-direction:column;gap:5px;min-height:0;overflow:hidden}
    .feed-item{padding:7px 8px;border:1px solid rgba(119,190,226,.16);background:linear-gradient(180deg,rgba(15,42,64,.82),rgba(8,25,40,.88));border-radius:7px;min-height:0;flex:1}
    .feed-head{display:flex;align-items:center;gap:7px;color:#a9d8ef;font-size:10px;white-space:nowrap;overflow:hidden}
    .feed-head span{overflow:hidden;text-overflow:ellipsis}
    .feed-item p{margin:4px 0 0;color:#f4fbff;font-size:10px;line-height:1.35;display:-webkit-box;-webkit-line-clamp:4;-webkit-box-orient:vertical;overflow:hidden}
    .empty{padding:12px;color:var(--muted);font-size:11px;text-align:center}
    .map-panel{position:absolute;inset:0;z-index:1;display:flex;flex-direction:column;overflow:hidden;border:0;background:transparent;box-shadow:none}
    .map-head{position:absolute;z-index:6;left:304px;top:8px;right:auto;display:flex;justify-content:flex-start;align-items:start;pointer-events:none}
    .map-head h2,.map-head span{display:none}
    .map-card{pointer-events:auto;width:168px;border:1px solid rgba(255,207,102,.3);background:rgba(15,35,55,.68);border-radius:7px;padding:6px 8px}
    .map-card .name{font-size:12px;color:#fff}.map-card .num{font-size:22px;font-weight:800;line-height:1.05;color:var(--hot);margin-top:2px}
    .map-card .meta{font-size:9px;color:#bce5fa;line-height:1.3}.map-wrap{position:relative;flex:1;min-height:0;padding:0}
    #chinaMap{width:100%;height:100%;min-height:0}.nanhai{position:absolute;right:24px;bottom:16px;width:118px;height:92px;border:1px dashed rgba(190,226,245,.68);border-radius:4px;color:#b9e3f8;font-size:10px;display:grid;place-items:end center;padding-bottom:8px;background:rgba(5,19,34,.28);pointer-events:none}
    .ripple-layer{position:absolute;inset:0;pointer-events:none;z-index:4}.ripple{position:absolute;width:10px;height:10px;border-radius:50%;transform:translate(-50%,-50%)}.ripple::before,.ripple::after{content:"";position:absolute;inset:-2px;border-radius:50%;border:1.5px solid rgba(255,207,95,.8);animation:ripplePulse 2.6s ease-out infinite}.ripple::after{animation-delay:1.3s}.ripple .core{position:absolute;inset:2px;border-radius:50%;background:radial-gradient(circle,#fff7d6 0%,#ffd666 55%,rgba(255,122,69,.9) 100%);box-shadow:0 0 8px rgba(255,214,102,.75)}.ripple.low{width:8px;height:8px}.ripple.low::before,.ripple.low::after{border-color:rgba(155,216,245,.52)}.ripple.low .core{background:#9bd8f5;box-shadow:0 0 7px rgba(155,216,245,.55)}.ripple.hot{width:18px;height:18px}.ripple.hot::before,.ripple.hot::after{border-color:rgba(255,255,255,.92);border-width:2px}.ripple.hot .core{background:radial-gradient(circle,#fff 0%,#ffef9b 48%,#ff9f43 100%)}@keyframes ripplePulse{0%{transform:scale(.5);opacity:1}100%{transform:scale(2.5);opacity:0}}
    .ripple-label{position:absolute;left:12px;top:-12px;display:flex;flex-direction:column;align-items:flex-start;white-space:nowrap;color:#f3fbff;font-size:10px;font-weight:400;line-height:1.05;letter-spacing:0;text-shadow:0 1px 2px rgba(6,18,34,.85);pointer-events:none}
    .ripple-label .count{font-size:10px;font-weight:400;line-height:1}
    .ripple-label.centered{left:50%;top:-25px;transform:translateX(-50%);align-items:center}
    .map-ov{position:absolute;transform:translate(-50%,-50%);white-space:nowrap;font-size:10px;font-weight:700;color:#fff;text-shadow:0 1px 2px rgba(6,18,34,.92);pointer-events:none;z-index:5}
    .map-ov.dim{font-size:9px;font-weight:400;color:rgba(206,232,246,.9)}
    .toggle{border:1px solid rgba(127,197,236,.34);background:rgba(24,68,100,.72);color:#cdeeff;border-radius:999px;padding:3px 9px;font:inherit;font-size:10px;line-height:1.2;cursor:pointer}
    .toggle.paused{color:var(--hot);border-color:rgba(255,207,102,.55);background:rgba(76,55,18,.65)}
    .content-box{display:flex;flex:1;min-height:0;padding:4px 6px 6px}
    .risk-feed{padding:6px}
    .phase-tag{display:flex;align-items:center;gap:6px;font-size:11px;color:var(--muted);white-space:nowrap;overflow:hidden;min-width:0}
    .phase-tag b{color:var(--hot);font-weight:700}
    .kpi .sub{font-size:10px;color:var(--muted);margin-left:3px}
    .kacct{display:flex;flex-direction:column;gap:3px;flex:1;min-height:0;padding:4px 6px 6px;overflow:hidden}
    .kacct-head,.kacct-row{display:grid;grid-template-columns:minmax(0,1.45fr) 50px repeat(4,minmax(0,.78fr));gap:4px;align-items:center}
    .kacct-head{font-size:9px;color:var(--muted);padding:0 5px}
    .kacct-head span:not(:first-child){text-align:right}
    .kacct-head span:nth-child(2){text-align:center}
    .kacct-row{border:1px solid rgba(127,197,236,.14);background:rgba(10,28,47,.55);border-radius:6px;padding:3px 5px;min-height:0}
    .kacct-row .acct{display:flex;flex-direction:column;min-width:0}
    .kacct-row .acct b{font-size:11px;color:#fff;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
    .kacct-row .acct span{font-size:9px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
    .kacct-row .plat{text-align:center;font-size:9px;color:#9bd8f5;border:1px solid rgba(127,197,236,.24);border-radius:4px;padding:1px 0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
    .kacct-row .num{text-align:right;font-size:11px;color:#d8f0ff;white-space:nowrap}
    .kacct-row .num.hot{color:var(--hot);font-weight:700}
    .kacct-empty{display:grid;place-items:center;flex:1;min-height:0;padding:8px;text-align:center;font-size:10px;color:var(--muted);line-height:1.7}
    .attitude-toggle{display:flex;align-items:center;gap:3px;flex:0 0 auto}.attitude-toggle button{border:1px solid rgba(127,197,236,.34);background:rgba(24,68,100,.52);color:#b9dff2;padding:3px 7px;font:inherit;font-size:10px;line-height:1.1;cursor:pointer}.attitude-toggle button:first-child{border-radius:5px 0 0 5px}.attitude-toggle button:last-child{border-radius:0 5px 5px 0}.attitude-toggle button.active{background:rgba(56,189,232,.24);border-color:rgba(56,189,232,.78);color:#fff}
    @media(max-width:1500px){.screen{grid-template-rows:32px 34px minmax(0,1fr) 184px}.rail{grid-template-rows:minmax(0,1fr) 100px}.rail-left{width:260px;grid-template-rows:minmax(0,1fr) 205px}.rail-right{width:292px;grid-template-rows:minmax(0,1.15fr) minmax(0,.85fr)}.map-head{left:276px}.title{padding:0 22px}.title h1{font-size:20px}.title::before,.title::after{width:38px}.bottom{grid-template-columns:1.05fr .9fr 1fr 1fr 1.05fr}.split>div:first-child .chart{min-height:126px}.kpi span{font-size:11px}.kpi b{font-size:14px}}
  </style>
</head>
<body>
  <div id="app" class="screen">
    <header class="topbar">
      <div class="phase-tag" id="phaseTag"></div>
      <div class="title"><h1>民族团结进步宣传周舆情监测系统</h1></div>
      <div class="top-actions">
        <button id="reportOpenBtn" class="report-open" type="button">下载最新态势报告</button>
        <div class="live-status" id="liveStatus"><span class="dot"></span>连接中</div>
      </div>
    </header>
    <section id="kpis" class="kpis"></section>
    <main class="main">
      <aside class="rail rail-left">
        <section class="panel">
          <div class="panel-title"><h2><a href="region-detail.html" title="查看地区详情">地区数据统计</a></h2><button id="pauseBtn" class="toggle">暂停轮播</button></div>
          <div class="split">
            <div><div id="regionChart" class="chart"></div></div>
            <div id="regionMeta" class="mini-meta cols2"></div>
          </div>
        </section>
        <section class="panel">
          <div class="panel-title"><h2>地区信息流</h2><span id="regionFeedTag">真实原话</span></div>
          <div id="regionFeed" class="feed" style="padding:6px"></div>
        </section>
      </aside>
      <section class="map-panel">
        <div class="map-head">
          <div><h2>全国分省舆情热力态势</h2><span>省级热力 · 数字标注 · 点击下钻联动</span></div>
          <div id="mapCard" class="map-card"></div>
        </div>
        <div class="map-wrap"><div id="chinaMap"></div><div id="rippleLayer" class="ripple-layer"></div></div>
      </section>
      <aside class="rail rail-right">
        <section class="panel">
          <div class="panel-title"><h2><a href="platform-detail.html" title="查看平台详情">平台数据统计</a></h2><span id="platformTag"></span></div>
          <div class="split">
            <div><div id="platformChart" class="chart"></div><div id="platformTip" class="platform-tip"></div></div>
            <div id="platformMeta" class="mini-meta cols2"></div>
          </div>
        </section>
        <section class="panel">
          <div class="panel-title"><h2>平台信息流</h2><span id="platformFeedTag">真实原话</span></div>
          <div id="platformFeed" class="feed" style="padding:6px"></div>
        </section>
      </aside>
    </main>
    <section class="bottom">
      <section class="panel">
        <div class="panel-title timeline-title"><h2>舆情量随时间变化</h2><div class="timeline-controls"><button class="timeline-switch active" data-timeline-mode="hour">按小时</button><button class="timeline-switch" data-timeline-mode="day">按天</button></div><span id="timelineTag">今日00:00起 · 每小时新增</span></div>
        <div id="timelineChart" class="chart"></div>
      </section>
      <section class="panel">
        <div class="panel-title"><h2>总体态度</h2><span></span></div>
        <div id="attitudeChart" class="chart"></div>
      </section>
      <section class="panel">
        <div class="panel-title"><h2>态度分类</h2><div class="attitude-toggle"><button class="active" data-attitude-mode="support">支持</button><button data-attitude-mode="neutral">中性</button><button data-attitude-mode="problem">问题</button></div></div>
        <div id="attitudeClassChart" class="chart"></div>
      </section>
      <section class="panel">
        <div class="panel-title"><h2>风险信息</h2><span id="riskTag"></span></div>
        <div id="riskFeed" class="feed risk-feed"></div>
      </section>
      <section class="panel">
        <div class="panel-title"><h2>重点传播内容</h2><span id="contentTag"></span></div>
        <div class="content-box"><div id="contentFeed" class="feed"></div></div>
      </section>
    </section>
  </div>
  <div id="reportModalMask" class="report-modal-mask" role="dialog" aria-modal="true" aria-labelledby="reportModalTitle">
    <div class="report-modal">
      <div class="report-modal-head"><h2 id="reportModalTitle">下载最新态势报告</h2><button id="reportCloseBtn" class="report-close" type="button" aria-label="关闭">×</button></div>
      <div class="report-modal-body">
        <div class="report-field"><label for="reportDate">报告日期</label><select id="reportDate" class="report-select"></select></div>
        <div class="report-field"><label for="reportFormat">文件格式</label><select id="reportFormat" class="report-select"><option value="docx">Word（.docx）</option><option value="pdf">PDF（.pdf）</option></select></div>
        <div id="reportStatus" class="report-status">正在读取可用日期……</div>
        <div id="reportStorage" class="report-storage"></div>
      </div>
      <div class="report-modal-actions"><button id="reportCancelBtn" class="report-cancel" type="button">取消</button><button id="reportActionBtn" class="report-action" type="button" disabled>请稍候</button></div>
    </div>
  </div>
  <script src="assets/echarts.min.js"></script>
  <script src="assets/china.js"></script>
  <script src="assets/data.js"></script>
  <script>
  (function(){
    "use strict";
    const $=id=>document.getElementById(id);

    function pollReport(dateText,format){
      if(!$("reportModalMask").classList.contains("open"))return;

        const row=await response.json();
        if(!response.ok)throw new Error(row.error||`API ${response.status}`);
        const index=reportRows.findIndex(item=>item.date===row.date);
        if(index>=0)reportRows[index]=row;else reportRows.push(row);
        updateReportDialog();
        if((row.formats||[]).includes(format)&&row.status!=="generating"){
          window.location.href=reportDownloadUrl(row,format);
          return;
        }
        if(row.status==="generating")reportPollTimer=setTimeout(()=>pollReport(dateText,format),2000);
      }).catch(error=>{$("reportStatus").className="report-status error";$("reportStatus").textContent=`查询失败：${error.message}`;$("reportActionBtn").disabled=false;$("reportActionBtn").textContent="重试"});

    function startLive(){
      if(typeof EventSource==="undefined"){setLiveStatus("off","浏览器不支持实时推送");return}
      let src;
      try{src=new EventSource("/api/events")}catch(e){setLiveStatus("off","实时连接失败");return}
      src.onopen=()=>setLiveStatus("on","实时在线");
      src.onerror=()=>setLiveStatus("off","实时连接中断");
      src.onmessage=ev=>{
        let msg;
        try{msg=JSON.parse(ev.data)}catch(e){return}
        if(!msg)return;
        if(msg.type==="heartbeat"){setLiveStatus("on","实时在线 · "+formatDateText(msg.ts));return}
        if(msg.type==="incident"&&msg.incident){
          liveItems.unshift(msg.incident);
          if(liveItems.length>50)liveItems.pop();
          refreshFromServer();
        }else if(msg.type==="refresh"){

        }
      };
    }
    function normalizeProvince(name){
      if(!name)return "";
      if(PROVINCE_ALIASES[name])return PROVINCE_ALIASES[name];
      return String(name).replace(/省|市|壮族自治区|回族自治区|维吾尔自治区|自治区|特别行政区/g,"");
    }
    function provinceStats(name){
      const short=normalizeProvince(name);
      const hit=(D.provinces||[]).find(p=>normalizeProvince(p.name||p.short)===short);
      if(hit){
        return {
          total:Number(hit.value ?? hit.total ?? 0),
          support:Number(hit.support ?? 0),
          neutral:Number(hit.neutral ?? 0)
        };
      }
      const focus=regionFocusRows.find(r=>r.name===short);
      if(focus)return {total:Number(focus.total||0),support:Number(focus.support||0),neutral:Number(focus.neutral||0)};

    function buildRegionFocusRows(){

    function platformRows(){

        return PLATFORM_ORDER.map(name=>{

          };
        });
      }

    function attitudeRows(row){

    const ATTITUDE_CLASS_RULES={

    };
    const PROBLEMATIC_ATTITUDES=[
      ["明确批评",["明确批评","批评","criticism"]],

    ];
    function normalizedAttitudeKey(row){
      const raw=String(row?.type||row?.ground_truth_type||row?.groundTruthType||row?.name||row?.attitude||"").trim();
      const status=String(row?.status||row?.ground_truth_status||row?.groundTruthStatus||"").trim();
      if(ATTITUDE_CLASS_RULES.support.aliases.includes(raw)||/^normal/i.test(status))return "support";
      if(ATTITUDE_CLASS_RULES.neutral.aliases.includes(raw)||/^attention/i.test(status))return "neutral";
      if(ATTITUDE_CLASS_RULES.problematic.aliases.includes(raw)||/^problematic/i.test(status))return "problematic";
      return "";
    }
    function attitudeAggregate(){
      const source=D.attitude?.detail||D.attitude?.byType||D.attitude?.rows;
      if(!Array.isArray(source)||!source.length)return null;
      const macro={support:0,neutral:0,problematic:0};
      const details=new Map(PROBLEMATIC_ATTITUDES.map(([name])=>[name,0]));
      source.forEach(row=>{
        const value=Number(row.value??row.count??row.total??0);
        if(!value)return;
        const key=normalizedAttitudeKey(row);
        if(key)macro[key]+=value;
        const problem=PROBLEMATIC_ATTITUDES.find(([,aliases])=>{
          const raw=String(row?.type||row?.ground_truth_type||row?.groundTruthType||row?.name||row?.attitude||"").trim();
          return aliases.includes(raw);
        });
        if(problem)details.set(problem[0],details.get(problem[0])+value);
      });
      return {
        macro:[
          {name:ATTITUDE_CLASS_RULES.support.name,value:macro.support},
          {name:ATTITUDE_CLASS_RULES.neutral.name,value:macro.neutral},
          {name:ATTITUDE_CLASS_RULES.problematic.name,value:macro.problematic}
        ].filter(x=>x.value>0),
        problematic:PROBLEMATIC_ATTITUDES.map(([name])=>({name,value:details.get(name)||0})).filter(x=>x.value>0)
      };
    }
    function bottomAttitudeData(){
      // 统一口径：优先使用后端算好的态度构成（与顶部 KPI 完全一致）

      const problematic=(D.nonSupport||[]).filter(x=>x.name!=="咨询疑问");
      if(macro.length)return {macro,problematic};
      const aggregate=attitudeAggregate();
      if(aggregate)return aggregate;
      return {macro:[],problematic};

      return (D.quotes||[]).filter(q=>{

      const counts=new Map();
      quotesByRegion(region).forEach(q=>{const p=canonicalPlatformName(q.platform)||"未标注";counts.set(p,(counts.get(p)||0)+1)});

    }
    function pickLatest(rows,count){
      return [...rows]
        .sort((a,b)=>feedTimestamp(b).localeCompare(feedTimestamp(a)))
        .slice(0,Math.max(1,count||1));
    }
    function pickRolling(rows,count,key){
      const sorted=[...rows].sort((a,b)=>feedTimestamp(b).localeCompare(feedTimestamp(a)));
      if(!sorted.length)return [];
      const size=Math.max(1,count||1);
      const start=(state[key]||0)%sorted.length;
      return Array.from({length:Math.min(size,sorted.length)},(_,i)=>sorted[(start+i)%sorted.length]);
    }
    function formatDateText(text){
      return String(text||"").replace(/T/g," ").replace(/(\.\d+)?([+-]\d{2}:?\d{2}|Z)$/,"");

    function renderFeed(id,rows,emptyText,count,rollKey){

      box.innerHTML=items.length?items.map(q=>`<article class="feed-item"><div class="feed-head"><span>${escapeHtml(q.region||q.group||"未标注地区")}</span><span>${escapeHtml(q.platform||"未标注平台")}</span><span>${escapeHtml(feedPublisher(q))}</span><span>${escapeHtml(formatDateText(feedTimestamp(q))||"未标注时间")}</span></div><p>${escapeHtml(q.text||q.content||q.title||"")}</p></article>`).join(""):`<div class="empty">${emptyText}</div>`;
    }
    function escapeHtml(text){

    function renderRipples(){
      const layer=$("rippleLayer");
      if(!layer||!charts.map||!window.CHINA_GEO)return;
      layer.innerHTML="";
      const rows=new Map();
      ((window.CHINA_GEO&&window.CHINA_GEO.features)||[]).forEach(f=>{
        const short=normalizeProvince(f.properties&&f.properties.name);
        const stats=provinceStats(short);
        if(stats.total>0)rows.set(short,{name:short,value:stats.total,total:stats.total});
      });
      rotationProvinceSet().forEach(short=>{
        if(!rows.has(short))rows.set(short,{name:short,value:0,total:0});
      });
      [...rows.entries()].forEach(([short,p])=>{
        const full=provinceFullName(short);
        const feature=(window.CHINA_GEO.features||[]).find(f=>f.properties&&f.properties.name===full);
        const c=feature?.properties?.centroid||feature?.properties?.center;
        if(!c)return;
        const pt=charts.map.convertToPixel({seriesIndex:0},c);
        if(!pt||pt[0]<0||pt[1]<0||pt[0]>layer.clientWidth||pt[1]>layer.clientHeight)return;
          const d=document.createElement("div");
          d.className=(p.total||p.value||0)>0?"ripple":"ripple low";
          d.dataset.prov=full;
          d.style.left=pt[0]+"px";
          d.style.top=pt[1]+"px";
          // 省份名称与数量统一由地图标签显示（河北/甘肃也已补齐），这里只画波纹点
          d.innerHTML=`<span class="core"></span>`;
          layer.appendChild(d);
        });
      // 小面积行政区（北京/天津/河北/上海/香港/澳门）用覆盖层精确摆放标签，避免互相重叠
      Object.keys(OVERLAY_LABEL_OFFSETS).forEach(short=>{
        const full=provinceFullName(short);
        const feature=(window.CHINA_GEO.features||[]).find(f=>f.properties&&f.properties.name===full);
        const c=feature&&(feature.properties.centroid||feature.properties.center);
        if(!c)return;
        const pt=charts.map.convertToPixel({seriesIndex:0},c);
        if(!pt||Number.isNaN(pt[0])||Number.isNaN(pt[1]))return;
        const off=OVERLAY_LABEL_OFFSETS[short];
        const stats=provinceStats(short);
        const el=document.createElement("div");
        el.className="map-ov"+((stats.total||0)>0?"":" dim");
        el.style.left=(pt[0]+off[0])+"px";
        el.style.top=(pt[1]+off[1])+"px";
        el.textContent=`${short} ${fmt(stats.total||0)}`;
        layer.appendChild(el);
      });
      }

    function showPlatformTip(name){
      const tip=$("platformTip");
      if(!tip||!charts.platform)return;
      const rows=platformRows();
      const row=rows.find(x=>x.name===name);
      const idx=rows.findIndex(x=>x.name===name);
      if(!row||idx<0){hidePlatformTip();return}
      const total=Math.max(Number(row.total||0),1);
      const support=Number(row.support||0),neutral=Number(row.neutral||0),nonSupport=Number(row.nonSupport||0);
      const sW=(support/total*100).toFixed(2),nW=(neutral/total*100).toFixed(2),nsW=Math.max(0,100-Number(sW)-Number(nW)).toFixed(2);
      tip.innerHTML=`<div class="tip-name">${escapeHtml(row.name)}</div><div class="tip-total"><span>总量</span><b>${fmt(row.total||0)}</b></div><div class="tip-bar"><span style="width:${sW}%;background:#38bde8"></span><span style="width:${nW}%;background:#8fc7bf"></span><span style="width:${nsW}%;background:#d96f6a"></span></div><div class="tip-foot"><span>支持 ${percent(support,total)}</span><span>中性 ${percent(neutral,total)}</span><span>非支持 ${percent(nonSupport,total)}</span></div>`;
      const chartBox=$("platformChart").getBoundingClientRect();
      const wrapBox=tip.parentElement.getBoundingClientRect();
      const rowH=(chartBox.height-14)/Math.max(rows.length,1);
      tip.style.display="block";
      const w=tip.offsetWidth||214,h=tip.offsetHeight||112;
      const left=Math.max(4,Math.min(112,wrapBox.width-w-4));
      const top=Math.max(4,Math.min(8+rowH*(idx+.5)-h/2,wrapBox.height-h-4));
      tip.style.left=left+"px";
      tip.style.top=top+"px";
    }

      charts.platform.on("click",p=>{const idx=platformRows().findIndex(x=>x.name===p.name);if(idx>=0)setFocusState({platformIndex:idx})});
      charts.platform.on("mouseover",p=>{
        if(p.componentType==="series"){
          hidePlatformTip();
          return;
        }
        if(p.componentType!=="yAxis")return;
        showPlatformTip(p.value);
      });
      charts.platform.on("globalout",hidePlatformTip);
      charts.map.on("click",p=>{
        const province=normalizeProvince(p.name);
        const idx=regionFocusRows.findIndex(r=>regionProvinces(r.name).includes(province)||r.name===province);
        if(idx>=0)setFocusState({regionIndex:idx});
      });
      charts.timeline.on("click",p=>{const idx=timelineRows().findIndex(x=>String(x.hour||x.date||"")===String(p.name||""));if(idx>=0)setFocusState({timelineIndex:idx})});
      document.querySelectorAll("[data-attitude-mode]").forEach(button=>button.onclick=()=>{
        state.attitudeMode=button.dataset.attitudeMode;
        document.querySelectorAll("[data-attitude-mode]").forEach(node=>node.classList.toggle("active",node===button));
        renderAttitudeClassPanel();
      });
      window.addEventListener("resize",()=>Object.values(charts).forEach(c=>{try{c.resize()}catch(e){}}));
      window.addEventListener("resize",()=>{try{renderNanhaiFrame();renderRipples()}catch(e){}});
    }
    function startRotation(){
      // 地区改为固定 10 个重点地区；平台和时点轮换，信息流按时间滚动
      setInterval(()=>{if(!state.paused)setFocusState({platformIndex:state.platformIndex+1})},9000);
      setInterval(()=>{if(!state.paused)setFocusState({timelineIndex:state.timelineIndex+1})},4000);
      setInterval(()=>{if(!state.paused){state.regionFeedIndex++;state.platformFeedIndex++;state.contentFeedIndex++;state.riskFeedIndex++;renderAll()}},5000);
      $("pauseBtn").onclick=()=>{state.paused=!state.paused;$("pauseBtn").textContent=state.paused?"继续轮播":"暂停轮播";$("pauseBtn").classList.toggle("paused",state.paused)};
      document.querySelectorAll("[data-timeline-mode]").forEach(button=>button.onclick=()=>{
        state.timelineMode=button.dataset.timelineMode;
        state.timelineIndex=0;
        document.querySelectorAll("[data-timeline-mode]").forEach(node=>node.classList.toggle("active",node===button));
        renderBottomCharts();
      });
      // 定期从后端重新拉取，保证“最近10分钟/当前小时新增”等实时指标跟着时间走
      setInterval(()=>{if(!state.paused)refreshFromServer()},30000);
    }
    function renderPhaseTag(){
      const el=$("phaseTag");
      if(!el)return;
      el.innerHTML=`起始统计时间：<b>2026年9月16日</b>`;
    }
    loadDashboardData().then(data=>{
      D=data;
      if(!D)throw new Error("DASH_DATA 未加载");
      buildRegionFocusRows();
      const bestRegion=regionFocusRows.reduce((best,r,i)=>r.total>(regionFocusRows[best]?.total||0)?i:best,0);
      if(regionFocusRows[bestRegion]&&regionFocusRows[bestRegion].total>0)state.regionIndex=bestRegion;
      renderPhaseTag();
      renderKpis();
      initCharts();
      renderAll();
      startRotation();
      if(D.live){
        liveItems=(D.live.incidents||[]).slice(0,50);
        startLive();
      }else{
        setLiveStatus("off","离线模式（静态数据）");
      }
    }).catch(err=>{
      document.body.innerHTML=`<div class="empty">大屏加载失败：${escapeHtml(err.message)}</div>`;
      console.error(err);
    });
  })();
  </script>
</body>
</html>
